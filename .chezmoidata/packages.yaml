# Package + extension manifest consumed by the bootstrap scripts in
# .chezmoiscripts. Edit here; the scripts iterate these lists.

packages:
  # Windows — installed with `winget install`.
  winget:
    # Core
    - Git.Git
    - Microsoft.PowerShell
    - Microsoft.VisualStudioCode
    - GitHub.cli
    - GitHub.Copilot            # Copilot CLI
    - Neovim.Neovim
    - wez.wezterm
    # Modern CLI utilities
    - sharkdp.bat
    - sharkdp.fd
    - eza-community.eza
    - BurntSushi.ripgrep.MSVC
    - junegunn.fzf
    - ajeetdsouza.zoxide
    - jqlang.jq
    - jftuga.less
    - dandavison.delta
    - StephanDilly.gitui
    - JanDeDobbeleer.OhMyPosh
    - GnuPG.GnuPG
    # Languages, runtimes & toolchains
    - OpenJS.NodeJS
    - Python.Python.3.14
    - GoLang.Go
    - Rustlang.Rustup
    - astral-sh.uv
    - BrechtSanders.WinLibs.POSIX.UCRT   # gcc/g++ (MinGW-w64)
    # Windows desktop apps
    - AltSnap.AltSnap
    - Vivaldi.Vivaldi
    - Postman.Postman

  # Windows: optional work-laptop apps. Installed only when you answer "yes" to
  # the `installWorkApps` prompt at `chezmoi init` (defaults to yes on a machine
  # you mark as "work").
  wingetWork:
    - DBeaver.DBeaver.Community
    - SUSE.RancherDesktop
    - OpenAI.Codex
    - GitHub.CopilotApp

  # Linux — best effort. Installed with `apt-get install`.
  apt:
    - git
    - neovim
    - ripgrep
    - fzf
    - bat
    - fd-find
    - jq
    - less
    - zoxide
    - gnupg
    - golang-go
    - python3
    - python3-pip
    - nodejs
    - npm
    - build-essential

  # Linux — installed with `cargo install` (not reliably packaged in apt).
  cargo:
    - gitui
    - git-delta
    - eza

